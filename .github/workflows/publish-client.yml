name: Publish Kubo client

# Cada push compila o client e entrega-o a TODOS os launchers, sem lançar o launcher de novo.
# A versão do Minecraft vem do gradle.properties (minecraft_version), por isso um port para outra versão
# (num branch "mc-1.20.1", por exemplo) publica sozinho o jar certo com o nome certo.
#
# Precisa do segredo LAUNCHER_REPO_TOKEN (token com acesso a Contents e Actions do repositório do launcher)
# e da variável LAUNCHER_REPO ("dono/kubo-launcher").
on:
  push:
    branches: [main, "mc-*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # para pôr os jars numa Release deste repositório
      actions: write # para apagar os artifacts antigos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: ./gradlew build -x test --no-daemon
      - name: Juntar os jars para descarregar
        run: |
          mkdir -p download
          cp $(ls build/libs/*.jar | grep -v -e sources -e dev) download/
          cp "$(ls build/libs/*.jar | grep -v -e sources -e dev | head -1)" download/kubo-1.21.11.jar
          for j in extensions/*/build/libs/*.jar; do
            case "$j" in *sources*|*dev*) ;; *) [ -f "$j" ] && cp "$j" download/ ;; esac
          done
      - name: Publicar no launcher
        env:
          GH_TOKEN: ${{ secrets.LAUNCHER_REPO_TOKEN }}
          REPO: ${{ vars.LAUNCHER_REPO }}
          SRC: ${{ vars.LAUNCHER_SRC_REPO }}
        run: |
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          mkdir -p out
          main=$(ls build/libs/*.jar | grep -v -e sources -e dev | head -1)
          cp "$main" "out/kubo__${MC}.jar"
          comb=$(ls extensions/combat/build/libs/*.jar 2>/dev/null | grep -v -e sources -e dev | head -1 || true)
          [ -n "$comb" ] && cp "$comb" "out/kubo-combat__${MC}.jar"
          gh release view mods-src --repo "$REPO" >/dev/null 2>&1 || gh release create mods-src --repo "$REPO" --prerelease --title "Mod sources" --notes "Jars do client, publicados pelo CI do mod."
          gh release upload mods-src out/*.jar --repo "$REPO" --clobber
          gh workflow run mods.yml --repo "$SRC"
      # Só fica o jar da última run: apaga os "caos-client-mod" anteriores para não gastar o espaço de artifacts.
      - name: Apagar artifacts antigos
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SELF: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO_SELF/actions/artifacts?name=caos-client-mod&per_page=100" --jq '.artifacts[].id' | while read -r id; do
            gh api -X DELETE "repos/$REPO_SELF/actions/artifacts/$id" || true
          done
      # Os jars ficam numa Release deste repositório ("Mod - ultimo build", na coluna da direita da página principal, em Releases).
      # Uma Release NAO gasta a quota de "artifacts" do GitHub Actions (que enchia e dava "Artifact storage quota has been hit").
      # Vem depois de publicar e não pode falhar a run: o launcher recebe o client na mesma.
      - name: Mod para descarregar (Release)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mod-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create mod-latest --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Mod - ultimo build" --notes "Jars do último build do client. Cada push substitui estes ficheiros."
          gh release upload mod-latest download/*.jar --repo "$GITHUB_REPOSITORY" --clobber

  # ---------------------------------------------------------------------------------------------------------------------
  # Minecraft 26.1 e 26.2 (codigo na pasta port26/, nomes oficiais da Mojang, Java 25). Nao mexe no 1.21.11: se uma destas
  # falhar, o jar do 1.21.11 ja foi publicado pelo job "publish" acima.
  # ---------------------------------------------------------------------------------------------------------------------
  publish26:
    runs-on: ubuntu-22.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.1", "26.2"]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar ${{ matrix.mc }}
        working-directory: port26
        run: |
          chmod +x gradlew
          ./gradlew build -x test --no-daemon -Pmc=${{ matrix.mc }}
      - name: Publicar no launcher
        env:
          GH_TOKEN: ${{ secrets.LAUNCHER_REPO_TOKEN }}
          REPO: ${{ vars.LAUNCHER_REPO }}
          MC: ${{ matrix.mc }}
        run: |
          mkdir -p out download
          main=$(ls port26/build/libs/*.jar | grep -v -e sources -e dev | head -1)
          cp "$main" "out/kubo__${MC}.jar"
          cp "$main" "download/kubo-${MC}.jar"
          comb=$(ls port26/extensions/combat/build/libs/*.jar 2>/dev/null | grep -v -e sources -e dev | head -1 || true)
          [ -n "$comb" ] && cp "$comb" "out/kubo-combat__${MC}.jar"
          gh release view mods-src --repo "$REPO" >/dev/null 2>&1 || gh release create mods-src --repo "$REPO" --prerelease --title "Mod sources" --notes "Jars do client, publicados pelo CI do mod."
          gh release upload mods-src out/*.jar --repo "$REPO" --clobber
      - name: Mod para descarregar (Release)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mod-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create mod-latest --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Mod - ultimo build" --notes "Jars do último build do client. Cada push substitui estes ficheiros."
          gh release upload mod-latest download/*.jar --repo "$GITHUB_REPOSITORY" --clobber

  # Depois de TODOS os jars estarem na release do launcher, gera o mods.json uma vez (com 1.21.11, 26.1 e 26.2).
  manifest:
    needs: [publish, publish26]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: Gerar o mods.json no launcher
        env:
          GH_TOKEN: ${{ secrets.LAUNCHER_REPO_TOKEN }}
          SRC: ${{ vars.LAUNCHER_SRC_REPO }}
        run: gh workflow run mods.yml --repo "$SRC"
