<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lobby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --panel:rgba(14,20,34,.94); --line:rgba(255,255,255,.09); --txt:#eef2fb; --mut:#8e99b3;
  --blue:#2d55f5; --blue2:#3c63ff; --green:#4ade80; --n:#09090b;
  --font:'Poppins',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--n);color:var(--txt);font-family:var(--font);font-size:14px;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button{font-family:inherit}

/* black frame + rounded stage (same as the reference NotchNav) */
#frame{position:fixed;inset:0;background:var(--n);padding:0;transition:padding .2s}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:#0c1220;border-radius:0;isolation:isolate}
@media (min-width:768px){#frame{padding:8px}#stage{border-radius:16px}}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#topfade{position:absolute;left:0;right:0;top:0;height:120px;pointer-events:none;background:linear-gradient(180deg,rgba(9,9,11,.45),rgba(9,9,11,0))}

/* Minecraft name tags */
#tags{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.tag{position:absolute;left:0;top:0;padding:1px 5px 2px;background:rgba(0,0,0,.3);color:#fff;font:700 14px/1.25 "Courier New",ui-monospace,Menlo,monospace;text-shadow:1.5px 1.5px 0 #3b3b3b;white-space:nowrap;will-change:transform;transform-origin:50% 100%}
.tag.invited{color:#aaa}

/* ===== notches ===== */
.notch{position:absolute;top:0;z-index:50;display:flex;background:var(--n);color:#fafafa;user-select:none}
.wing{position:absolute;width:10px;height:10px;color:var(--n);pointer-events:none;display:block}
.wing svg{width:100%;height:100%;overflow:visible;fill:currentColor;stroke:none;display:block}
@media (min-width:768px){.wing{width:16px;height:16px}}
.wing.left{right:100%;top:0}.wing.right{left:100%;top:0}.wing.cl{left:0;top:100%}.wing.cr{right:0;top:100%}

.aside{height:40px;padding:0 20px;align-items:center}
#nL{left:0;border-radius:0 0 24px 0}
#nR{right:0;border-radius:0 0 0 24px}
#nC{left:50%;transform:translateX(-50%);height:44px;padding:0 16px;border-radius:0 0 24px 24px;align-items:flex-start}
#nItems{position:relative;display:flex;gap:4px}
#pill{position:absolute;left:0;top:0;height:36px;width:0;border-radius:999px;background:#27272a;transition:transform .38s cubic-bezier(.3,1.25,.5,1),width .38s cubic-bezier(.3,1.25,.5,1)}
.nitem{all:unset;position:relative;z-index:1;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;cursor:pointer;color:#a1a1aa;font:500 14px/1 var(--font);white-space:nowrap;transition:color .2s}
.nitem:hover{color:#e4e4e7}
.nitem.on{color:#fafafa;font-weight:600}
.nitem svg{width:16px;height:16px;flex:none}
.nitem .chooseLbl{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.nb{font:700 10px/1 var(--font);letter-spacing:-.01em;text-transform:uppercase;background:#27272a;color:#d4d4d8;padding:3px 6px;border-radius:999px}
.nitem.on .nb{background:#3f3f46}
.nbtn{all:unset;position:relative;display:flex;align-items:center;gap:7px;height:34px;min-width:34px;justify-content:center;border-radius:999px;padding:0 9px;cursor:pointer;color:#e4e4e7;font:600 12.5px/1 var(--font);transition:background .15s,color .15s}
.nbtn svg{width:18px;height:18px}
.nbtn:hover,.nbtn.on{background:#27272a;color:#fff}
.nbtn:active{transform:scale(.94)}
.cnt{font:600 11px/1 var(--font);color:#a1a1aa}

/* compact island (phones / small windows) */
#island{display:none;position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:50;flex-direction:column;padding:0 14px;border-radius:0 0 24px 24px;background:var(--n);min-width:min(300px,calc(100% - 70px))}
#island .bar{display:flex;align-items:center;justify-content:space-between;gap:8px;height:40px}
#mTrig{all:unset;flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 10px;border-radius:999px;cursor:pointer;font:600 13px/1 var(--font);color:#fafafa}
#mTrig svg{width:15px;height:15px;color:#a1a1aa}
#mTrig .cv svg{transition:transform .2s}
#island.open #mTrig .cv svg{transform:rotate(180deg)}
#mLbl{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mDrop{display:grid;grid-template-rows:0fr;opacity:0;pointer-events:none;transition:grid-template-rows .2s ease-out,opacity .2s}
#island.open #mDrop{grid-template-rows:1fr;opacity:1;pointer-events:auto}
#mDrop>div{overflow:hidden}
#mDrop .in{display:flex;flex-direction:column;gap:2px;padding:6px 2px 10px}
.ditem{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;color:#a1a1aa;font:500 14px/1 var(--font)}
.ditem svg{width:16px;height:16px}
.ditem:hover{background:#18181b;color:#e4e4e7}
.ditem.on{background:#27272a;color:#fafafa;font-weight:600}
@media (max-width:999px){#nL,#nC,#nR{display:none}#island{display:flex}}

/* ===== dropdown panels under the notch ===== */
#scrim{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;z-index:30;top:60px;width:min(400px,calc(100% - 24px));max-height:calc(100% - 76px);display:flex;flex-direction:column;padding:16px;border-radius:20px;background:var(--panel);border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.5);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:0;pointer-events:none;transition:opacity .22s,transform .3s cubic-bezier(.2,.8,.2,1)}
#sheet{left:50%;transform:translate(-50%,-14px)}
#sheet.open{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#invite{right:12px;transform:translateY(-14px)}
#invite.open{opacity:1;pointer-events:auto;transform:none}
@media (max-width:999px){#invite{right:auto;left:50%;transform:translate(-50%,-14px)}#invite.open{transform:translate(-50%,0)}.sheet{top:56px}}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600;font-size:15px}
.sheet .hd small{color:var(--mut);font-weight:500;font-size:12px;margin-left:8px}
.x{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--mut);font-size:16px}
.x:hover{background:rgba(255,255,255,.1);color:#fff}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:11px;font-weight:500;font-size:13px;color:#fff;min-width:74px}
.btn:active{transform:scale(.95)}
.btn.blue{background:var(--blue)}.btn.ghost{background:rgba(255,255,255,.09)}
.list{overflow:auto;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:11px;font-weight:500;font-size:13px;color:#fff;min-width:74px}
.btn:active{transform:scale(.95)}
.btn.blue{background:var(--blue)}.btn.ghost{background:rgba(255,255,255,.09)}

.srv{all:unset;cursor:pointer;display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid transparent;flex:none}
.srv:hover{background:rgba(255,255,255,.08)}
.srv.sel{border-color:var(--blue2);background:rgba(60,99,255,.14)}
.srv .ico{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(120% 140% at 30% 0%,hsl(var(--h) 80% 45%),hsl(var(--h) 60% 14%))}
.srv .ico i{width:18px;height:18px;border-radius:50%;background:#0a1a3a;box-shadow:inset 0 0 0 3px #7fb0ff}
.srv .mt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.srv .mt b{font-weight:600;font-size:13.5px}
.srv .mt small{color:var(--mut);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srv .ck{opacity:0;color:var(--blue2);font-size:20px}
.srv.sel .ck{opacity:1}
#addForm{display:flex;gap:8px;margin-top:12px}
#ipInput{all:unset;box-sizing:border-box;flex:1;min-width:0;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:13.5px;user-select:text;-webkit-user-select:text}
#ipInput:focus{border-color:var(--blue2)}
#ipInput::placeholder{color:#6f7a96}

.row{display:flex;align-items:center;gap:12px;padding:3px 0}
.row .av{width:38px;height:38px;border-radius:10px;image-rendering:pixelated;background:#1c2540;flex:none}
.row .who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.row .who b{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis}
.row .who small{color:var(--mut);font-size:11.5px}
.row .who small.ok{color:var(--green)}


#addForm{display:flex;gap:8px;margin-top:12px}
#ipInput{all:unset;box-sizing:border-box;flex:1;min-width:0;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:13.5px;user-select:text;-webkit-user-select:text}
#ipInput:focus{border-color:var(--blue2)}
#ipInput::placeholder{color:#6f7a96}
#wheel{position:absolute;inset:0;z-index:40;display:none;place-items:center;background:radial-gradient(circle at 50% 50%,rgba(6,10,20,.55),rgba(6,10,20,.8));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#wheel.on{display:grid;animation:wfade .18s ease-out}
@keyframes wfade{from{opacity:0}to{opacity:1}}
#wheelRing{position:relative;width:min(390px,92vw,70vh);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(20,28,48,.92) 38%,rgba(20,28,48,.55) 39%,rgba(20,28,48,.3) 70%);border:1px solid var(--line);animation:wpop .22s cubic-bezier(.2,1.3,.4,1)}
@keyframes wpop{from{transform:scale(.7)}to{transform:none}}
#wheelLbl{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:14px;color:#c9d2ea;text-align:center;padding:0 34%;pointer-events:none}
.slice{all:unset;cursor:pointer;position:absolute;width:21%;aspect-ratio:1;margin:-10.5% 0 0 -10.5%;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line);display:grid;place-items:center;font-size:clamp(24px,7vw,34px);transition:transform .12s,background .15s}
.slice:hover{transform:scale(1.18);background:rgba(60,99,255,.45)}
.slice i{position:absolute;right:2px;bottom:1px;font:500 10px var(--font);color:#9aa6c4;font-style:normal;opacity:.8}
.emo{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;transform-origin:50% 100%}
.emo span{display:block;font-size:34px;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));animation:epop .45s cubic-bezier(.2,1.6,.4,1) both,efloat 1.6s ease-in-out .45s infinite alternate}
@keyframes epop{from{transform:scale(0) translateY(10px)}to{transform:none}}
@keyframes efloat{to{transform:translateY(-5px)}}
#joining{position:absolute;inset:0;z-index:60;background:rgba(8,12,22,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .4s}
#joining.on{opacity:1;pointer-events:auto}
#joining i{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--blue2);animation:sp .8s linear infinite}
#joining b{font-size:16px;font-weight:600}
#joining small{color:var(--mut)}
#toasts{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:9px 16px;border-radius:12px;background:rgba(10,15,28,.95);border:1px solid var(--line);font-size:13px;font-weight:500;opacity:0;transform:translateY(-8px);transition:all .28s;white-space:nowrap}
.toast.in{opacity:1;transform:none}
#loading{position:fixed;inset:0;z-index:50;background:#0c1220;display:grid;place-items:center;transition:opacity .7s ease .1s}
#loading.gone{opacity:0;pointer-events:none}
#loading i{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--blue2);animation:sp .8s linear infinite}

@keyframes sp{to{transform:rotate(360deg)}}
#loading{position:fixed;inset:0;z-index:99;background:#0c1220;display:grid;place-items:center;transition:opacity .7s ease .1s}
#loading.gone{opacity:0;pointer-events:none}
#loading i{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--blue2);animation:sp .8s linear infinite}
.member #inviteList .btn,.member [data-act="choose"]{display:none!important}
</style>
</head>
<body>
<!--
  ============================  LOBBY REQUIREMENTS (hidden note)  ============================
  EN: Players pressing the G key in the lobby MUST be able to open the EMOTE WHEEL and use
      EMOJIS in the lobby (everyone in the lobby sees them over the player's head).
      - G toggles the wheel, keys 1-8 or a click pick an emote, Esc / click outside closes it.
      - Already implemented for this HTML: see openWheel() / playEmote(name, emoji).
      - When integrating into the client: forward the G key to this page and send the other
        players' emotes with window.OneMenu.emote("playerName", "emoji").
  PT: Os jogadores, ao pressionarem a tecla G no lobby, TÊM de conseguir abrir a EMOTE WHEEL e
      usar EMOJIS no lobby (todos no lobby veem o emoji por cima da cabeça do jogador).
  Lobby layout: players are spread around the lobby, some chatting in pairs and some sitting.
  Only the lobby is needed: Choose (server) -> Play -> everybody joins the server together.
  ==============================================================================================
-->
<div id="frame"><div id="stage">
  <canvas id="scene"></canvas>
  <div id="topfade"></div>
  <div id="tags"></div>

  <!-- desktop: left notch = exit -->
  <aside id="nL" class="notch aside" aria-label="Exit">
    <button class="nbtn" data-act="exit" title="Exit" aria-label="Exit"><span data-icon="logout" style="display:contents"></span></button>
    <b class="wing right" data-w="right"></b><b class="wing cl" data-w="cl"></b>
  </aside>

  <!-- desktop: center notch = Choose / Play / Emotes -->
  <header id="nC" class="notch" role="tablist">
    <b class="wing left" data-w="left"></b><b class="wing right" data-w="right"></b>
    <div id="nItems">
      <span id="pill"></span>
      <button class="nitem" data-act="choose"><span data-icon="grid" style="display:contents"></span><span class="chooseLbl">Choose</span></button>
      <button class="nitem on" data-act="play"><span data-icon="play" style="display:contents"></span><span>Play</span></button>
      <button class="nitem" data-act="emotes"><span data-icon="smile" style="display:contents"></span><span>Emotes</span><span class="nb">G</span></button>
    </div>
  </header>

  <!-- desktop: right notch = add people -->
  <aside id="nR" class="notch aside" aria-label="Party">
    <b class="wing left" data-w="left"></b><b class="wing cr" data-w="cr"></b>
    <button class="nbtn" data-act="invite" title="Invite friends"><span data-icon="add" style="display:contents"></span><span class="cnt">1/8</span></button>
  </aside>

  <!-- phones / small windows: one compact island -->
  <div id="island">
    <b class="wing left" data-w="left"></b><b class="wing right" data-w="right"></b>
    <div class="bar">
      <button class="nbtn" data-act="exit" aria-label="Exit"><span data-icon="logout" style="display:contents"></span></button>
      <button id="mTrig" data-act="menu" aria-label="Menu"><span id="mIc" style="display:contents"></span><span id="mLbl">Play</span><span class="cv" style="display:contents"><span data-icon="chev" style="display:contents"></span></span></button>
      <button class="nbtn" data-act="invite" aria-label="Invite friends"><span data-icon="add" style="display:contents"></span><span class="cnt">1/8</span></button>
    </div>
    <div id="mDrop"><div><div class="in">
      <button class="ditem" data-act="choose"><span data-icon="grid" style="display:contents"></span><span class="chooseLbl">Choose</span></button>
      <button class="ditem on" data-act="play"><span data-icon="play" style="display:contents"></span><span>Play</span></button>
      <button class="ditem" data-act="emotes"><span data-icon="smile" style="display:contents"></span><span>Emotes</span></button>
    </div></div></div>
  </div>

  <div id="wheel"><div id="wheelRing"><div id="wheelLbl">Emotes</div></div></div>
  <div id="scrim"></div>

  <section id="sheet" class="sheet">
    <div class="hd"><span>Choose a server</span><button class="x" id="sheetClose">✕</button></div>
    <div id="servers" class="list"></div>
    <form id="addForm"><input id="ipInput" placeholder="Add server IP" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn blue" type="submit">Add</button></form>
  </section>

  <section id="invite" class="sheet">
    <div class="hd"><span>Invite to party<small id="partyCount">1 of 8</small></span><button class="x" id="invClose">✕</button></div>
    <div id="inviteList" class="list"></div>
  </section>

  <div id="joining"><i></i><b>Joining <span id="joinName"></span></b><small>Everyone is coming with you</small><button class="btn ghost" id="cancelJoin">Cancel</button></div>
  <div id="toasts"></div>
</div></div>
