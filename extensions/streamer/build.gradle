plugins {
	id 'fabric-loom'
}

version = '1.0.0'
group = 'dev.kuboext'

base {
	archivesName = 'kubo-ext-streamer'
}

dependencies {
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
	// the Kubo client itself (only to compile against: the player already has it)
	compileOnly project(path: ':', configuration: 'namedElements')
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// TikTok Live plays mp3 sounds with JLayer; the Kubo jar already ships it, so only needed to compile
repositories {
	mavenCentral()
}
dependencies {
	compileOnly 'javazoom:jlayer:1.0.1'
}
